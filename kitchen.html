<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F5">
  <title>Cuisine · Tapigo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tapigo.css?v=9">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <div class="logo" aria-hidden="true">T</div>
      <p class="eyebrow">Espace restaurateur</p>
      <h1>Connexion</h1>
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="login__error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Se connecter</button>
    </form>
  </div>

  <div class="kds" hidden>
    <header class="k-top">
      <div class="k-brand">
        <div class="logo" id="kLogo" aria-hidden="true">T</div>
        <div>
          <h1 id="kName">Restaurant</h1>
          <p>Tapigo · Cuisine &amp; Bar</p>
        </div>
      </div>

      <nav class="k-tabs" role="tablist" aria-label="Sections">
        <button class="k-tab" role="tab" type="button" data-view="orders" aria-selected="true">Commandes <span class="count" id="newCount" hidden>0</span></button>
        <button class="k-tab" role="tab" type="button" data-view="stock" aria-selected="false">Stocks <span class="count count--warn" id="stockCount" hidden>0</span></button>
        <button class="k-tab" role="tab" type="button" data-view="menu" aria-selected="false">Menu</button>
        <button class="k-tab" role="tab" type="button" data-view="stats" aria-selected="false">Statistiques</button>
      </nav>

      <div class="k-top__spacer"></div>

      <div class="k-top__actions">
        <button class="btn btn--ghost btn--sm" type="button" id="simulateBtn" title="Simuler une commande client"><span id="boltIcon"></span><span class="k-btn-label">Simuler une commande</span></button>
        <button class="btn btn--ghost btn--sm pause-btn" type="button" id="pauseBtn" aria-pressed="false" title="Suspendre les commandes en ligne">Pause</button>
        <button class="btn btn--ghost btn--sm" type="button" id="logoutBtn" hidden>Mon compte</button>
        <button class="icon-btn sound-btn" type="button" id="soundBtn" aria-pressed="false" aria-label="Activer les alertes sonores" title="Alertes sonores"></button>
        <span class="k-clock" id="kClock">--:--</span>
      </div>
    </header>

    <div class="k-offline" id="offlineBanner" role="alert" hidden>Connexion perdue : les nouvelles commandes n’arrivent plus. Vérifiez le Wi-Fi de la tablette.</div>
    <main class="k-main">
      <section id="ordersView"></section>
      <section id="stockView" hidden></section>
      <section id="menuView" hidden></section>
      <section id="statsView" hidden></section>
    </main>
  </div>

  <div id="printArea" aria-hidden="true"></div>

  <script src="js/data.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/config.js?v=9"></script>
  <script src="js/store-remote.js?v=9"></script>
  <script src="js/ui.js?v=9"></script>
  <script src="js/stats.js?v=9"></script>
  <script src="js/kitchen.js?v=9"></script>
</body>
</html>
