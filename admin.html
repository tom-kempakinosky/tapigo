<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F5">
  <meta name="robots" content="noindex">
  <title>Administration · Tapigo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tapigo.css?v=6">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <div class="logo" aria-hidden="true">T</div>
      <p class="eyebrow">Administration Tapigo</p>
      <h1>Connexion</h1>
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="login__error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Se connecter</button>
    </form>
  </div>

  <div class="kds" id="app" hidden>
    <header class="k-top">
      <div class="k-brand">
        <div class="logo" aria-hidden="true">T</div>
        <div>
          <h1>Tapigo</h1>
          <p>Administration des restaurants</p>
        </div>
      </div>
      <div class="k-top__spacer"></div>
      <div class="k-top__actions">
        <a class="btn btn--ghost btn--sm" href="kitchen.html">Dashboard</a>
        <button class="btn btn--ghost btn--sm" type="button" id="accountBtn">Mon compte</button>
      </div>
    </header>
    <main class="k-main">
      <div class="editor" id="adminView"></div>
    </main>
  </div>

  <script src="js/data.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/store-remote.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
</body>
</html>
