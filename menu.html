<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Menu · Tapigo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/tapigo.css?v=3">
</head>
<body class="client">

  <div class="c-wrap">
    <header class="c-header">
      <div class="c-header__row">
        <div class="logo" id="rLogo" aria-hidden="true">T</div>
        <div class="c-header__name">
          <h1 id="rName">Restaurant</h1>
          <p id="rTagline"></p>
        </div>
        <div class="table-badge" id="tableBadge" aria-live="polite"></div>
      </div>
      <div class="c-welcome" id="welcome"></div>
    </header>

    <div class="c-toolbar" id="toolbar">
      <label class="search">
        <span id="searchIcon"></span>
        <input id="search" type="search" placeholder="Rechercher un plat, un ingrédient…" autocomplete="off" aria-label="Rechercher dans le menu">
        <button class="search__clear" id="searchClear" type="button" aria-label="Effacer la recherche" hidden>✕</button>
      </label>
      <nav class="chips" id="catChips" aria-label="Catégories"></nav>
      <div class="chips" id="tagChips" aria-label="Filtres rapides"></div>
    </div>

    <main id="menu" aria-live="polite"><div class="empty"><span class="spinner" style="display:inline-block;border-color:var(--line);border-top-color:var(--ink)"></span><p style="margin-top:12px">Chargement de la carte…</p></div></main>
  </div>

  <button class="track-pill" id="trackPill" type="button" hidden>
    <span class="pulse-dot"></span><span id="trackPillLabel">Suivre ma commande</span>
  </button>

  <button class="cart-bar" id="cartBar" type="button" hidden>
    <span class="cart-bar__count" id="cartCount">0</span>
    <span class="cart-bar__label">Voir le panier</span>
    <span class="cart-bar__total" id="cartTotal">0,00 €</span>
  </button>

  <div id="trackRoot"></div>

  <script src="js/data.js?v=3"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/store-remote.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/menu.js?v=3"></script>
</body>
</html>
